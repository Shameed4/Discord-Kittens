services:
  node1:
    build: { context: ./game }
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ID=node1
      - ADVERTISE_ADDR=node1:8080
  node2:
    build: { context: ./game }
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ID=node2
      - ADVERTISE_ADDR=node2:8080
  node3:
    build: { context: ./game }
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ID=node3
      - ADVERTISE_ADDR=node3:8080
  redis:
    image: redis:7-alpine
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [node1, node2, node3]
