name: Keep Render warm

# Render's free tier spins a web service down after 15 minutes without
# inbound traffic. Pinging /healthz every 10 minutes keeps it awake so
# players never hit a cold start.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health check
        env:
          # Override with a repo variable (Settings → Variables → Actions) if the URL changes.
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://discord-kittens.onrender.com/healthz' }}
        run: |
          # Generous timeout + retries: if the service did go to sleep,
          # the first request has to wait out the cold start.
          curl --fail --silent --show-error --location \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "$HEALTH_URL"
          echo "OK: $HEALTH_URL"
