events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # increase amount of time to wait before server is healthy again
  upstream nodes {
    server node1:8080 fail_timeout=30s;
    server node2:8080 fail_timeout=30s;
    server node3:8080 fail_timeout=30s;
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://nodes;

      # wait this long for a handshake response
      proxy_connect_timeout 2s;

      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }
  }
}